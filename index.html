<html lang="ro">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title lang="en">Robert's Birthday</title>
        <link rel="icon" href="./favicon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="header">
            <h1><span id="countTheDays">Astazi este ziua de nastere a lui</span> <br> 🥁 <br> ROBERT <br> 🎉 <br></h1>
            <img id="bff-img" src="./bday.svg">
            <h2 id="bday-age" class="counter-box"><span id="seconds">0</span> clipe</h2>
            <h3 id="bday-date">4 August</h4>
        </div>
        
        <div class="gift-section">
            <h2 class="gift-title">Iata cat de fericit sunt pentru tine astazi 🥳</h2>
            <h3 class="gift-hint">(Deschide cadoul!)</h3>
            <div class="gift-img" id="gift-img-happy"></div>
        </div>
        
        <div class="gift-section">
            <h2 class="gift-title">Daca ar fi sa te descriu intr-un singur cuvant 👇</h2>
            <div class="gift-img" id="gift-img-relaxed"></div>
        </div>
        
        <div class="gift-section">
            <h2 class="gift-title">Unul din filmele tale preferate 💪</h2>
            <div class="gift-img" id="gift-img-movie"></div>
        </div>
        
        <div class="gift-section">
            <h2 class="gift-title">Am avut dreptate? 🧐</h2>
            <div class="gift-img" id="gift-img-right"></div>
        </div>

        <div class="gift-section">
            <h2 class="gift-title">Inca unul 🎁</h2>
            <div class="gift-img" id="gift-img-birthday"></div>
        </div>
        
        <p id="footer">Inspirat din <a href="https://scrimba.com/learn/htmlandcss" target="_blank">acest curs de pe scrimba</a></p>
        
        <script src="./index.js"></script>
    </body>
</html>
